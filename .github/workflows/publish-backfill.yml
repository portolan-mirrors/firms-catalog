name: publish-backfill

# Turn the artifacts that backfill.yml produced into published year files.
#
# Split from the fetch on purpose. The fetch runs for about a day and needs no
# cloud credentials; this runs for minutes and needs them, so a Source
# Cooperative session token stays valid for the whole of it.
#
# One job per year, because the slices are keyed by (source, year): building
# year=Y needs at most four artifacts, never the whole 9 GB. The aggregate job
# then reads the PUBLISHED data back out of the bucket rather than holding the
# archive on a 14 GB runner.

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'JSON list of years, e.g. [2000,2001]. Blank = every year with artifacts.'
        required: false
        default: ""
      run_id:
        description: "backfill run id to pull artifacts from (blank = latest)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.p.outputs.years }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
          YEARS_IN: ${{ inputs.years }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          set -euo pipefail
          # Artifacts accumulate across backfill runs, and a year needs every
          # sensor that FIRMS serves for it. Publishing a year whose slices are
          # only partly banked would write a file that looks complete and
          # silently omits a sensor, so only fully banked years are emitted.
          curl -sf --retry 8 --retry-delay 15 --retry-all-errors --max-time 120 \
            "https://firms.modaps.eosdis.nasa.gov/api/data_availability/csv/${FIRMS_MAP_KEY}/ALL" \
            > availability.csv
          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq '[.artifacts[]|select(.expired==false and (.name|startswith("slice-")))
                   |{name, id}]' > artifacts.json
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import csv, json, os
          avail = {}
          with open("availability.csv") as f:
              for r in csv.DictReader(f):
                  avail[r["data_id"]] = (r["min_date"], r["max_date"])
          # Newest artifact wins if a slice was fetched more than once.
          banked = {}
          for a in json.load(open("artifacts.json")):
              banked.setdefault(a["name"], a["id"])
          expected = {}
          for sl in json.load(open("tools/backfill_slices.json")):
              rng = avail.get(sl["source"])
              if not rng:
                  continue
              lo, hi = rng
              y = sl["year"]
              if max(f"{y}-01-01", lo) > min(f"{y}-12-31", hi):
                  continue          # FIRMS serves nothing for this slice
              expected.setdefault(y, []).append(f"slice-{sl['source']}-{y}")
          want = os.environ.get("YEARS_IN", "").strip()
          want = set(json.loads(want)) if want else None
          out, skipped = [], []
          for y, names in sorted(expected.items()):
              if want is not None and y not in want:
                  continue
              have = [n for n in names if n in banked]
              if len(have) != len(names):
                  skipped.append(f"{y} ({len(have)}/{len(names)})")
                  continue
              out.append({"year": y, "ids": [banked[n] for n in have]})
          print("matrix=" + json.dumps({"include": [
              {"year": o["year"], "ids": ",".join(str(i) for i in o["ids"])} for o in out]}))
          print("skipped=" + " ".join(skipped))
          EOF
          echo "incomplete, not published: $(grep '^skipped=' "$GITHUB_OUTPUT" | cut -d= -f2-)"

  year:
    needs: plan
    if: needs.plan.outputs.years != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        year: ${{ fromJson(needs.plan.outputs.years) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: |
          pip install --quiet duckdb boto3 \
            'git+https://github.com/geoparquet/geoparquet-io.git@main'
      - name: Download this year's slices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl chunks
          # Slices for one year can live in different backfill runs, so fetch
          # each artifact by id rather than pulling one run's whole set.
          for id in $(echo "${{ matrix.ids }}" | tr ',' ' '); do
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "dl/$id.zip"
            unzip -q -o "dl/$id.zip" -d "dl/$id"
          done
          find dl -name '*.tar.gz' -print -exec tar -xzf {} -C chunks \;
          echo "chunk files: $(find chunks -name '*.parquet' | wc -l)"

      - name: Build year=${{ matrix.year }}
        run: |
          python3 tools/firms_build.py --chunks ./chunks \
            --out ./staging/publish/detections --years ${{ matrix.year }} --memory 6GB
      - name: Upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SOURCE_COOP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SOURCE_COOP_SECRET_ACCESS_KEY }}
          # Source Cooperative's CLI issues temporary credentials, which need a
          # session token. Harmless and empty when permanent keys are used.
          AWS_SESSION_TOKEN: ${{ secrets.SOURCE_COOP_SESSION_TOKEN }}
        run: python3 tools/upload_data.py --confirm --data-dir ./staging/publish
