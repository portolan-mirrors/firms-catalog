name: pages

# Publish apps/firms-preview to GitHub Pages.
#
# The app reads the PUBLISHED tiles by default, so the hosted copy needs no
# configuration. Append ?tiles=./fire-latest.pmtiles to point a local checkout at a
# local build instead.

on:
  push:
    branches: [main]
    paths: ["apps/firms-preview/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/firms-preview
      - id: deploy
        uses: actions/deploy-pages@v4
