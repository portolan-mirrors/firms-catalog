name: pages

# Publish the apps to GitHub Pages.
#
# The root is the deck.gl explorer, which is the one to land on. The MapLibre
# explorer stays at /explorer/ and the tiling preview moves to /preview/.
# All three read the PUBLISHED catalog by default, so the hosted copies need
# no configuration. Append ?tiles=./fire-latest.pmtiles (preview) or ?base=…
# (explorer) to point a local checkout at a local build.

on:
  push:
    branches: [main]
    paths:
      - "apps/firms-preview/**"
      - "apps/firms-explorer/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p site/explorer site/preview
          # Copy the files git tracks, not the directory: a local checkout also
          # holds gitignored .pmtiles symlinks pointing outside the repo, and
          # publishing those would ship broken links (or gigabytes).
          git ls-files -z apps/firms-preview  | xargs -0 -I{} cp {} site/preview/
          git ls-files -z apps/firms-explorer | xargs -0 -I{} cp {} site/explorer/
          # The root is the deck.gl explorer. It loads its modules as "./x.js",
          # so the whole app directory goes to the root too and deck.html
          # becomes index.html there -- copying the one file would give a page
          # whose imports all 404.
          git ls-files -z apps/firms-explorer | xargs -0 -I{} cp {} site/
          mv site/deck.html site/index.html
          rm -f site/preview/serve.py site/*.test.mjs site/explorer/*.test.mjs

          # Stamp the module imports with the commit.
          #
          # Pages serves assets with cache-control: max-age=600, and the HTML
          # is revalidated while the modules it imports are not. A deploy that
          # changes both therefore hands a returning visitor new HTML and a
          # ten-minute-old module -- and if the new HTML imports a symbol the
          # old module does not export, the page does not start at all. That
          # is not theoretical: it happened on the deploy that added bestCover.
          #
          # A query string per commit makes each deploy a different URL, so the
          # old copy is never the one that answers.
          V=${GITHUB_SHA::12}
          find site -name '*.html' -o -name '*.js' | while read -r f; do
            perl -pi -e 's{(from\s+"\./[A-Za-z0-9_.-]+\.js)"}{$1?v='"$V"'"}g' "$f"
          done
          echo "stamped module imports with $V"
          grep -o 'from "\./[a-z-]*\.js?v=[0-9a-f]*"' site/index.html | sort -u | head
          echo "root:";     ls site
          echo "explorer:"; ls site/explorer
          echo "preview:";  ls site/preview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
