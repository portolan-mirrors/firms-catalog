name: pages

# Publish both apps to GitHub Pages.
#
# firms-preview stays at the root so its URL does not move; firms-explorer is
# served at /explorer/. Both read the PUBLISHED catalog by default, so the
# hosted copies need no configuration. Append ?tiles=./fire-latest.pmtiles
# (preview) or ?base=… (explorer) to point a local checkout at a local build.

on:
  push:
    branches: [main]
    paths:
      - "apps/firms-preview/**"
      - "apps/firms-explorer/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p site/explorer
          # Copy the files git tracks, not the directory: a local checkout also
          # holds gitignored .pmtiles symlinks pointing outside the repo, and
          # publishing those would ship broken links (or gigabytes).
          git ls-files -z apps/firms-preview  | xargs -0 -I{} cp {} site/
          git ls-files -z apps/firms-explorer | xargs -0 -I{} cp {} site/explorer/
          rm -f site/serve.py site/explorer/*.test.mjs
          echo "root:"; ls site; echo "explorer:"; ls site/explorer
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
