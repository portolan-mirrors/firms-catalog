name: refresh-nrt

# Refresh the rolling near-real-time window.
#
# This reads the FIRMS bulk CSV feeds, which need no MAP_KEY and cost no API
# transactions, so it can run as often as FIRMS republishes them. Measured on
# 2026-09-07, those files were regenerated 20-29 minutes before the check, and
# the observation-to-availability latency was 2h37m.
#
# It writes year=<Y>/live.parquet, never the archive's detections.parquet, so
# the hourly run re-uploads about 34 MB rather than the whole year. Both parts
# match the collection's partition:glob.
#
# Nothing is committed. Extents, row counts and `updated` are regenerated and
# uploaded, so the repository keeps only the stable catalog definition and the
# git history stays readable.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Shared with consolidate-year: both write year=<Y> objects, and two of them
# uploading at once would interleave a half-built archive with a good one.
concurrency:
  group: catalog-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: |
          set -euo pipefail
          # stac-check belongs here too: the validation gate runs before the
          # upload and refuses to pass when it is missing rather than reporting
          # a green it did not earn, so leaving it out fails the job outright.
          pip install --quiet duckdb boto3 'rashid>=0.1.8,<0.2.0' stac-check \
            'git+https://github.com/geoparquet/geoparquet-io.git@main'
          sudo apt-get update -qq && sudo apt-get install -y -qq tippecanoe
          # make_timeline.py and make_breaks.py write archive metadata with
          # `pmtiles edit`. Without the binary every hourly run got as far as
          # building the tileset and then died on FileNotFoundError: 'pmtiles'.
          #
          # The release assets carry the version in their name, so there is no
          # stable "latest" filename. Resolve the tag, then build the URL --
          # guessing it returns an HTML 404 page, which tar reports only as
          # "gzip: stdin: not in gzip format".
          PMT=$(curl -sSf https://api.github.com/repos/protomaps/go-pmtiles/releases/latest \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].lstrip("v"))')
          curl -sSfL --retry 3 \
            "https://github.com/protomaps/go-pmtiles/releases/download/v$PMT/go-pmtiles_${PMT}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin pmtiles
          tippecanoe --version
          pmtiles version

      - name: Fetch the rolling window
        run: python3 tools/firms_nrt.py --window 7d --out ./staging/nrt-chunks

      - name: Build the live part
        run: |
          python3 tools/firms_build.py --chunks ./staging/nrt-chunks \
            --out ./staging/publish/detections --name live.parquet --memory 6GB

      # r5 -> r8 -> points, the shape the year archives and all-time use. The
      # rolling window was the last archive on its own scheme (r4/r6/r10), so
      # cells changed size when the timeline crossed from "last 7 days" into a
      # year, which is exactly what unifying the bands was meant to stop.
      - name: Rebuild aggregates and the combined tileset
        run: |
          python3 tools/firms_aggregate.py --data ./staging/publish/detections \
            --out ./staging/agg --tiles ./staging/publish/detections \
            --part live.parquet \
            --resolution 8 --levels 5 --features-min-zoom 9 --bands "5:0,8:6"

      # Both paths matter and both were wrong. The tileset belongs under
      # detections/: the collection and the app resolve "./fire-latest.pmtiles"
      # relative to detections/collection.json, so a copy at the bucket root is
      # one nothing reads. And the styles belong in catalog/detections/styles,
      # which publish.py uploads -- written into the data directory they were
      # dropped on the floor, because upload_data.py only carries .parquet,
      # .pmtiles, .tif and .laz.
      #
      # Breaks come before styles because the styles are generated FROM them.
      # The refresh rebuilds the archive from scratch every hour, so anything
      # not regenerated here is lost: skipping this step republished an archive
      # with no firms:breaks at all, and every viewer silently fell back to a
      # fixed ramp tuned for different data.
      - name: Class breaks and styles
        run: |
          python3 tools/make_breaks.py ./staging/publish/detections/fire-latest.pmtiles \
            --band "8:./staging/agg/cells.parquet" \
            --band "5:./staging/agg/cells_r5.parquet"
          python3 tools/make_styles.py ./staging/publish/detections/fire-latest.pmtiles \
            --out catalog/detections/styles --tiles ../fire-latest.pmtiles \
            --suffix ", last 7 days"

      - name: Regenerate collection metadata
        run: |
          cp catalog/detections/detections.thumb.jpg ./staging/publish/ || true
          python3 tools/make_collection.py --data ./staging/publish/detections \
            --out catalog/detections/collection.json

      - name: Validate before uploading anything
        env:
          CI_LIGHT: "1"
        run: python3 tests/run_all.py

      # Source Cooperative's bucket is reached by assuming a role it has
      # approved, so there is no long-lived key to leak or rotate. GitHub
      # mints the token per job; the role's trust policy admits any repo
      # under the portolan-mirrors org, so other mirrors reuse it unchanged.
      - name: Assume the Source Cooperative write role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::939788573396:role/source-coop-portolan-mirrors
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
          aws-region: us-west-2

      - name: Upload data
        run: python3 tools/upload_data.py --confirm --data-dir ./staging/publish

      - name: Publish catalog metadata
        run: python3 tools/publish.py --confirm
