name: consolidate-year

# Fold the rolling window into the current year's archive, and rebuild that
# year's tileset from it.
#
# refresh-nrt rewrites live.parquet and nothing else, so the year's
# detections.parquet only moves when a human runs a year build. The window is
# a fixed span back from now: it slides forward a day per day and the archive
# does not, so once they stop overlapping every detection in between is in no
# published file. Nothing fails -- the window still carries rows, the
# collection's total still climbs, and the hole sits behind them unreported.
#
# Daily, against a seven-day window, so six days of margin have to be missed
# before anything is lost. merge_live.py refuses outright if the overlap has
# already closed rather than quietly writing across the hole.

on:
  schedule:
    # 03:40 UTC: off the hour, where GitHub's scheduler is least contended, and
    # in the quietest part of the NRT feeds' day.
    - cron: "40 3 * * *"
  workflow_dispatch:
    inputs:
      year:
        description: "Year(s) to consolidate, space separated (blank = current, plus the old one in early January)"
        required: false
        default: ""
      allow_gap:
        description: "Merge even if the window no longer reaches the archive"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# Shared with refresh-nrt: both write year=<Y> objects, and two of them
# uploading at once would interleave a half-built archive with a good one.
concurrency:
  group: catalog-write
  cancel-in-progress: false

jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          set -euo pipefail
          pip install --quiet duckdb boto3 'rashid>=0.1.8,<0.2.0' stac-check \
            'git+https://github.com/geoparquet/geoparquet-io.git@main'
          sudo apt-get update -qq && sudo apt-get install -y -qq tippecanoe
          PMT=$(curl -sSf https://api.github.com/repos/protomaps/go-pmtiles/releases/latest \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"].lstrip("v"))')
          curl -sSfL --retry 3 \
            "https://github.com/protomaps/go-pmtiles/releases/download/v$PMT/go-pmtiles_${PMT}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin pmtiles
          tippecanoe --version
          pmtiles version

      # Across New Year the seven-day window straddles two years, and each
      # has its own partition: the old one still needs its last days, the new
      # one does not exist yet. Both are handled, and only in early January is
      # the old one touched at all -- which is what keeps the work bounded.
      # Each year starts a fresh detections.parquet and fire-<year>.pmtiles,
      # so the daily cost grows through a year and resets when it turns.
      - name: Pick the years
        id: y
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.year }}" ]; then
            YEARS="${{ inputs.year }}"
          else
            NOW=$(date -u +%Y); DOY=$(date -u +%j)
            YEARS="$NOW"
            # 10 matches merge_live.py's seeding window: while the old year can
            # still be extended by a window that reaches into it.
            if [ "$((10#$DOY))" -le 10 ]; then YEARS="$((NOW - 1)) $NOW"; fi
          fi
          echo "years=$YEARS" >> "$GITHUB_OUTPUT"
          echo "consolidating: $YEARS"

      - name: Fetch the published years and their rolling windows
        env:
          YEARS: ${{ steps.y.outputs.years }}
        run: |
          set -euo pipefail
          B=https://data.source.coop/portolan-mirrors/firms-catalog/detections
          # From the bucket rather than rebuilt: the archive is the thing being
          # extended, and re-deriving a year of NRT to add a day is waste.
          # Either part may legitimately be absent -- a year has no archive
          # until its first consolidation, and no window once the rolling
          # window has moved past it -- so a 404 is not an error here.
          for Y in $YEARS; do
            mkdir -p "./staging/publish/detections/year=$Y"
            for f in detections.parquet live.parquet; do
              if curl -sSfL --retry 3 -o "./staging/publish/detections/year=$Y/$f" \
                   "$B/year=$Y/$f"; then
                ls -la "./staging/publish/detections/year=$Y/$f"
              else
                rm -f "./staging/publish/detections/year=$Y/$f"
                echo "  year=$Y/$f not published"
              fi
            done
          done

      - name: Fold each window into its year
        env:
          YEARS: ${{ steps.y.outputs.years }}
          ALLOW_GAP: ${{ inputs.allow_gap && '--allow-gap' || '' }}
        run: |
          set -euo pipefail
          for Y in $YEARS; do
            echo "=== $Y ==="
            python3 tools/merge_live.py --data ./staging/publish/detections \
              --year "$Y" --memory 6GB $ALLOW_GAP
          done

      - name: Rebuild each year's tileset
        env:
          YEARS: ${{ steps.y.outputs.years }}
        run: |
          set -euo pipefail
          for Y in $YEARS; do
            # Skip a year the merge left without an archive: no window was
            # published for it, so there is nothing new to tile.
            [ -f "./staging/publish/detections/year=$Y/detections.parquet" ] || {
              echo "=== $Y: no archive, nothing to tile ==="; continue; }
            echo "=== $Y ==="
            DATA=./staging/publish/detections \
            WORK="./staging/agg-$Y" \
            TILES="./staging/publish/detections/year=$Y" \
            CATALOG="catalog/detections/year=$Y" \
              bash tools/build_year.sh "$Y"
          done

      - name: Regenerate collection metadata
        run: |
          cp catalog/detections/detections.thumb.jpg ./staging/publish/ || true
          python3 tools/make_collection.py --data ./staging/publish/detections \
            --out catalog/detections/collection.json

      - name: Validate before uploading anything
        env:
          CI_LIGHT: "1"
        run: python3 tests/run_all.py

      - name: Assume the Source Cooperative write role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::939788573396:role/source-coop-portolan-mirrors
          role-session-name: ${{ github.event.repository.name }}-${{ github.run_id }}
          aws-region: us-west-2

      - name: Upload data
        run: python3 tools/upload_data.py --confirm --data-dir ./staging/publish

      # The item carries the year's row count and extent, read from the
      # published file, so it can only be regenerated once the upload lands.
      - name: Refresh the item and the collection
        env:
          YEARS: ${{ steps.y.outputs.years }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          set -euo pipefail
          python3 tools/make_items.py --catalog catalog --key "$FIRMS_MAP_KEY" \
            --years "$(echo $YEARS | tr ' ' ',')"
          python3 tools/make_collection.py --data ./staging/publish/detections \
            --out catalog/detections/collection.json

      - name: Publish catalog metadata
        run: python3 tools/publish.py --confirm
