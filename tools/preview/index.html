<!doctype html><html><head><meta charset="utf-8">
<title>FIRMS aggregation preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--dim:#8b949e;--acc:#f78166}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:13px/1.45 ui-sans-serif,-apple-system,"Segoe UI",sans-serif}
  #map{position:absolute;inset:0}
  .panel{position:absolute;top:12px;left:12px;width:290px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:14px;z-index:2;
    box-shadow:0 8px 28px rgba(0,0,0,.55);max-height:calc(100% - 24px);overflow:auto}
  h1{margin:0 0 2px;font-size:14px;letter-spacing:.2px}
  .sub{color:var(--dim);font-size:11px;margin-bottom:12px}
  .grp{margin:12px 0 6px;font-size:10px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim)}
  label{display:flex;gap:8px;align-items:flex-start;padding:5px 0;cursor:pointer}
  label span b{display:block;font-weight:600}
  label span i{font-style:normal;color:var(--dim);font-size:11px}
  input[type=radio]{margin-top:3px;accent-color:var(--acc)}
  .legend{display:flex;flex-direction:column;gap:3px;margin-top:8px}
  .row{display:flex;align-items:center;gap:8px;font-size:11px}
  .sw{width:16px;height:11px;border-radius:2px;flex:none}
  .stat{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;
    font-size:11px;color:var(--dim);display:flex;justify-content:space-between}
  .stat b{color:var(--fg);font-variant-numeric:tabular-nums}
  #pop{position:absolute;right:12px;top:12px;width:230px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:12px;z-index:2;display:none}
  #pop table{width:100%;border-collapse:collapse;font-size:11px}
  #pop td{padding:2px 0}#pop td:last-child{text-align:right;font-variant-numeric:tabular-nums}
</style></head><body>
<div id="map"></div>
<div class="panel">
  <h1>FIRMS aggregation preview</h1>
  <div class="sub">7-day NRT window &middot; 1,915,961 detections</div>

  <div class="grp">Layer</div>
  <label><input type="radio" name="ly" value="density" checked>
    <span><b>A5 density (aggregate)</b><i>3 levels &middot; 3.3 MB &middot; true counts</i></span></label>
  <label><input type="radio" name="ly" value="p7">
    <span><b>Raw points, 7 days</b><i>42 MB &middot; sampled at low zoom</i></span></label>
  <label><input type="radio" name="ly" value="p1">
    <span><b>Raw points, 1 day</b><i>6.6 MB &middot; 187,301 detections</i></span></label>

  <div id="lg"></div>
  <div class="stat"><span>zoom</span><b id="z">2.0</b></div>
  <div class="stat" style="border:0;padding-top:2px"><span>A5 level in view</span><b id="lvl">r2</b></div>
</div>
<div id="pop"><div class="grp" style="margin-top:0">Feature</div><table id="pt"></table></div>
<script>
maplibregl.addProtocol("pmtiles", new pmtiles.Protocol().tile);
const COUNT_STOPS=[[1,"#2c3d5a"],[5,"#3f6d8f"],[20,"#59a1a0"],[75,"#a8c268"],
                   [250,"#f2b134"],[1000,"#e8722c"],[4000,"#d1382a"]];
const FRP_STOPS=[[0,"#4a5bd4"],[10,"#39a0a8"],[50,"#c9cf4a"],[200,"#f0932b"],[1000,"#d63031"]];

const map=new maplibregl.Map({container:"map",hash:true,
  style:{version:8,sources:{
    base:{type:"raster",tiles:["https://tile.openstreetmap.org/{z}/{x}/{y}.png"],
          tileSize:256,attribution:"&copy; OpenStreetMap"}},
    layers:[{id:"base",type:"raster",source:"base",paint:{"raster-opacity":.35,"raster-saturation":-.9,"raster-brightness-max":.5}}]},
  center:[20,10],zoom:2});

function stepColor(field,stops){
  const e=["step",["get",field],stops[0][1]];
  for(let i=1;i<stops.length;i++)e.push(stops[i][0],stops[i][1]);
  return e;
}
function legend(title,stops,unit){
  let h=`<div class="grp">${title}</div><div class="legend">`;
  for(let i=0;i<stops.length;i++){
    const lo=stops[i][0], hi=stops[i+1]?stops[i+1][0]:null;
    h+=`<div class="row"><span class="sw" style="background:${stops[i][1]}"></span>`+
       `${hi?`${lo}–${hi}`:`${lo}+`} ${unit}</div>`;
  }
  return h+"</div>";
}

window._map=map;
map.on("load",()=>{
  map.addSource("density",{type:"vector",url:"pmtiles://./density.pmtiles"});
  map.addSource("p7",{type:"vector",url:"pmtiles://./points-only.pmtiles"});
  map.addSource("p1",{type:"vector",url:"pmtiles://./points-1d.pmtiles"});

  map.addLayer({id:"density",type:"fill",source:"density","source-layer":"aggregate",
    paint:{"fill-color":stepColor("count",COUNT_STOPS),"fill-opacity":.72,
           "fill-outline-color":"rgba(0,0,0,.25)"}});
  for(const s of ["p7","p1"]){
    map.addLayer({id:s,type:"circle",source:s,"source-layer":"detections",layout:{visibility:"none"},
      paint:{"circle-radius":["interpolate",["linear"],["zoom"],0,1.1,4,1.8,9,3.2],
             "circle-color":stepColor("frp",FRP_STOPS),
             "circle-opacity":.85,"circle-stroke-width":0}});
  }
  show("density");
});

function show(id){
  for(const l of ["density","p7","p1"])
    if(map.getLayer(l))map.setLayoutProperty(l,"visibility",l===id?"visible":"none");
  document.getElementById("lg").innerHTML = id==="density"
    ? legend("Detections per A5 cell",COUNT_STOPS,"")
    : legend("Fire radiative power",FRP_STOPS,"MW");
}
document.querySelectorAll("input[name=ly]").forEach(r=>
  r.addEventListener("change",e=>show(e.target.value)));

map.on("move",()=>{
  const z=map.getZoom();
  document.getElementById("z").textContent=z.toFixed(1);
  document.getElementById("lvl").textContent = z<1?"r2":z<3?"r5":"r8";
});
map.on("click",e=>{
  const f=map.queryRenderedFeatures(e.point,{layers:["density","p7","p1"].filter(l=>map.getLayer(l))});
  const pop=document.getElementById("pop");
  if(!f.length){pop.style.display="none";return;}
  const p=f[0].properties;
  document.getElementById("pt").innerHTML=Object.entries(p)
    .filter(([k])=>k!=="a5_cell").slice(0,12)
    .map(([k,v])=>`<tr><td>${k}</td><td>${typeof v==="number"?(+v).toLocaleString(undefined,{maximumFractionDigits:2}):v}</td></tr>`).join("");
  pop.style.display="block";
});
</script></body></html>
