<!doctype html><html><head><meta charset="utf-8">
<title>FIRMS tiling preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<script src="https://unpkg.com/protomaps-themes-base@4.5.0/dist/protomaps-themes-base.js"></script>
<style>
 :root{--bg:#0d1117;--panel:#12171f;--line:#2b3440;--fg:#e6edf3;--dim:#8b949e;
       --acc:#f78166;--warn:#d29922}
 *{box-sizing:border-box}
 html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
   font:12.5px/1.45 ui-sans-serif,-apple-system,"Segoe UI",sans-serif}
 #map{position:absolute;inset:0}
 .panel{position:absolute;top:10px;left:10px;width:302px;background:var(--panel);
   border:1px solid var(--line);border-radius:11px;padding:0;z-index:3;
   box-shadow:0 10px 34px rgba(0,0,0,.6);max-height:calc(100% - 20px);
   overflow:auto;backdrop-filter:blur(6px)}
 .hd{padding:13px 14px 10px;border-bottom:1px solid var(--line)}
 h1{margin:0;font-size:13.5px}
 .sub{color:var(--dim);font-size:10.5px;margin-top:2px}
 .sec{padding:11px 14px;border-bottom:1px solid var(--line)}
 .sec:last-child{border-bottom:0}
 .grp{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);
   margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
 .seg{display:flex;background:#0b0f15;border:1px solid var(--line);border-radius:7px;overflow:hidden}
 .seg button{flex:1;background:none;border:0;color:var(--dim);padding:6px 4px;
   font:inherit;font-size:11px;cursor:pointer}
 .seg button.on{background:var(--acc);color:#12171f;font-weight:600}
 select,input[type=range]{width:100%}
 select{background:#0b0f15;color:var(--fg);border:1px solid var(--line);
   border-radius:6px;padding:5px 7px;font:inherit;font-size:11.5px}
 .chips{display:flex;flex-wrap:wrap;gap:4px}
 .chip{border:1px solid var(--line);background:#0b0f15;color:var(--dim);
   border-radius:20px;padding:3px 9px;font-size:10.5px;cursor:pointer;user-select:none}
 .chip.on{border-color:var(--acc);color:var(--fg);background:rgba(247,129,102,.16)}
 .legend{display:flex;flex-direction:column;gap:2px}
 .row{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--dim);
   cursor:pointer;padding:1px 3px;border-radius:4px;user-select:none}
 .row:hover{background:rgba(255,255,255,.05)}
 .row.off{opacity:.38}
 .row.off .sw{box-shadow:inset 0 0 0 99px rgba(13,17,23,.72)}
 .row .cnt{margin-left:auto;font-variant-numeric:tabular-nums;opacity:.75}
 .sw{width:15px;height:10px;border-radius:2px;flex:none}
 .kv{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);padding:1px 0}
 .kv b{color:var(--fg);font-variant-numeric:tabular-nums}
 .note{font-size:10px;color:var(--warn);line-height:1.35;margin-top:6px}
 input[type=range]{accent-color:var(--acc)}
 .dual{position:relative;height:26px;margin-top:2px}
 .dual .track,.dual .fill{position:absolute;top:11px;height:4px;border-radius:2px}
 .dual .track{left:0;right:0;background:#0b0f15;border:1px solid var(--line)}
 .dual .fill{background:var(--acc);opacity:.75}
 .dual input[type=range]{position:absolute;top:0;left:0;width:100%;margin:0;
   background:none;pointer-events:none;-webkit-appearance:none;height:26px}
 .dual input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;
   pointer-events:auto;width:14px;height:14px;border-radius:50%;
   background:var(--fg);border:2px solid var(--acc);cursor:pointer}
 .ends{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:1px}
 #pop{position:absolute;right:10px;top:10px;width:224px;background:var(--panel);
   border:1px solid var(--line);border-radius:11px;padding:11px 13px;z-index:3;display:none}
 #pop table{width:100%;border-collapse:collapse;font-size:10.5px}
 #pop td{padding:1.5px 0;color:var(--dim)}
 #pop td:last-child{text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
 .x{float:right;cursor:pointer;color:var(--dim)}
</style></head><body>
<div id="map"></div>
<div class="panel">
  <div class="hd"><h1>FIRMS tiling preview</h1>
    <div class="sub" id="hdsub">loading…</div></div>

  <div class="sec"><div class="grp">Dataset</div>
    <!-- Filled by renderDatasetControl(): the list comes from the catalog, so
         there is nothing to hardcode here. -->
    <div class="seg" id="dataset"></div>
  </div>

  <div class="sec">
    <div class="kv"><span>cells in view</span><b id="ncells">–</b></div>
  </div>

  <div class="sec"><div class="grp">Mode</div>
    <div class="seg" id="mode">
      <button data-m="auto" class="on">Auto @ z10</button>
      <button data-m="agg">Aggregate</button>
      <button data-m="pts">Points</button></div>
    <div class="kv" style="margin-top:7px"><span>showing</span><b id="showing">aggregate</b></div>
    <div class="note" id="zwarn" style="display:none"></div>
  </div>

  <div class="sec">
    <div class="grp" id="lgtitle">Colour by</div>
    <select id="metric">
      <option value="count">Detections per cell</option>
      <option value="avg_frp">Average FRP (MW)</option>
      <option value="max_frp">Peak FRP (MW)</option>
      <option value="sum_frp">Total FRP (MW)</option>
    </select>
    <div id="lg" class="legend" style="margin-top:8px"></div>
    <div class="sub" id="lghint" style="margin-top:7px">Click a class to hide it.</div>
  </div>

  <div class="sec"><div class="grp"><span>Min FRP</span><b id="frpv" style="color:var(--fg)">0 MW</b></div>
    <input type="range" id="frp" min="0" max="500" step="5" value="0">
    <div class="sub" id="frpnote">Aggregate filters on the coloured FRP metric; points filter on their own FRP.</div>
  </div>

  <div class="sec"><div class="grp"><span id="daylabel">Days</span><b id="dayrange" style="color:var(--fg)">all</b></div>
    <div class="dual" id="dual">
      <div class="track"></div><div class="fill" id="dfill"></div>
      <input type="range" id="d0" min="0" max="0" step="1" value="0">
      <input type="range" id="d1" min="0" max="0" step="1" value="0">
    </div>
    <div class="ends"><span id="dlo"></span><span id="dhi"></span></div>
  </div>

  <div class="sec"><div class="grp">Sensor</div>
    <div class="chips" id="sensors"></div></div>

  <div class="sec"><div class="grp">Day / night</div>
    <div class="seg" id="dn">
      <button data-v="all" class="on">Both</button>
      <button data-v="D">Day</button>
      <button data-v="N">Night</button></div>
    <div class="note" id="xnote" style="display:none"></div>
  </div>

  <div class="sec">
    <div class="kv"><span>zoom</span><b id="z">2.0</b></div>
    <div class="kv"><span>features drawn</span><b id="nf">–</b></div>
  </div>
</div>
<div id="pop"><span class="x" onclick="document.getElementById('pop').style.display='none'">✕</span>
  <div class="grp">Feature</div><table id="pt"></table></div>
<script>
maplibregl.addProtocol("pmtiles", new pmtiles.Protocol().tile);

// Where the tiles live. Defaults to the published archive so the hosted app
// works with no configuration; ?tiles=./fire-latest.pmtiles points it at a local
// build for development.
const BASE = "https://data.source.coop/portolan-mirrors/firms-catalog/detections";
// Protomaps' OpenStreetMap basemap, hosted on the same origin as the data, so
// the demo pulls its background from Source Cooperative rather than a third
// party raster service.
const BASEMAP = "https://data.source.coop/protomaps/openstreetmap/tiles/v3.pmtiles";
const qs = new URLSearchParams(location.search);

// One entry per queryable slice of the archive. Only the two archives that
// have no STAC item of their own are named here — every year comes from the
// catalog in discoverYears(), so a newly tiled year appears without an edit.
//
// An unreachable archive is detected at load and its control disabled rather
// than registered: a source that never loads stops MapLibre reaching "loaded",
// and every idle-driven readout then freezes at its initial value.
const DATASETS = {
  live: {
    label: "Last 7 days",
    tiles: qs.get("tiles") || `${BASE}/fire-latest.pmtiles`,
  },
  alltime: {
    label: "All time",
    tiles: `${BASE}/alltime.pmtiles`,
    // The only slice that spans the whole record, so the collection's own
    // temporal extent and row count describe exactly what it holds.
    collection: `${BASE}/collection.json`,
  },
};
// Display order, kept beside DATASETS rather than read off it. A year id like
// "2020" is an array-index-like key, and JavaScript enumerates those first and
// in ascending numeric order however they were inserted — so Object.keys()
// would put 2000 at the top of the list and the rolling window below the years.
const DATASET_KEYS = ["live", "alltime"];

// Datasets are discovered, not hardcoded. The collection lists one item per
// published year, but a year only advertises a `pmtiles` asset once its
// archive is built. A year without one is skipped: putting it in the selector
// would offer a choice that loads nothing, and a source that never loads keeps
// MapLibre from reaching "loaded", freezing every idle-driven readout at zero.
async function discoverYears(){
  const collUrl = `${BASE}/collection.json`;
  let coll;
  try{
    coll = await (await fetch(collUrl)).json();
  }catch(e){
    console.warn("collection unavailable; the year list stays empty", e);
    return;
  }
  const items = (coll.links||[]).filter(l => l.rel === "item");
  const found = await Promise.all(items.map(async l => {
    // Resolve against the URL the href was read from. Item hrefs are relative
    // ("./year=2020/2020.json") and so are the asset hrefs inside each item;
    // joining the strings by hand puts the archive in the wrong directory.
    const href = new URL(l.href, collUrl).toString();
    try{
      const item = await (await fetch(href)).json();
      const tiles = (item.assets||{}).pmtiles;
      if(!tiles) return null;                  // published, not yet tiled
      const p = item.properties||{};
      const n = p["table:row_count"];
      const day = t => t ? t.slice(0,10) : "?";
      return {
        id: item.id,
        label: item.id,
        tiles: new URL(tiles.href, href).toString(),
        summary: `${day(p.start_datetime)} → ${day(p.end_datetime)}` +
                 (n ? ` · ${n.toLocaleString()} detections` : ""),
      };
    }catch(e){
      console.warn("skipping item "+href, e);
      return null;
    }
  }));
  // Newest first: the recent years are the ones anyone reaches for.
  for(const y of found.filter(Boolean).sort((a,b)=>b.id.localeCompare(a.id))){
    DATASETS[y.id] = y;
    DATASET_KEYS.push(y.id);
  }
}
const AGG_LAYER = "agg", PT_LAYER = "pts", SRC = "fire";

const AGG_SRC_LAYER="aggregate", PT_SRC_LAYER="features";
const aggId = () => AGG_LAYER;
const ptId  = () => PT_LAYER;
const RAMPS={
  count:   {stops:[[1,"#2c3d5a"],[5,"#3f6d8f"],[20,"#59a1a0"],[75,"#a8c268"],[250,"#f2b134"],[1000,"#e8722c"],[4000,"#d1382a"]],unit:""},
  avg_frp: {stops:[[0,"#2c3d5a"],[5,"#3f6d8f"],[15,"#59a1a0"],[40,"#a8c268"],[100,"#f2b134"],[250,"#e8722c"],[500,"#d1382a"]],unit:"MW"},
  max_frp: {stops:[[0,"#2c3d5a"],[25,"#3f6d8f"],[75,"#59a1a0"],[200,"#a8c268"],[600,"#f2b134"],[1500,"#e8722c"],[3000,"#d1382a"]],unit:"MW"},
  sum_frp: {stops:[[0,"#2c3d5a"],[100,"#3f6d8f"],[500,"#59a1a0"],[2000,"#a8c268"],[8000,"#f2b134"],[30000,"#e8722c"],[100000,"#d1382a"]],unit:"MW"},
  frp:     {stops:[[0,"#4a5bd4"],[10,"#39a0a8"],[50,"#c9cf4a"],[200,"#f0932b"],[1000,"#d63031"]],unit:"MW"},
};
const SENSORS=[["viirs_snpp","S-NPP"],["viirs_noaa20","NOAA-20"],["viirs_noaa21","NOAA-21"],["modis","MODIS"]];
const SENSOR_VAL={viirs_snpp:"VIIRS_SNPP",viirs_noaa20:"VIIRS_NOAA20",viirs_noaa21:"VIIRS_NOAA21",modis:"MODIS"};

let S={dataset:"live",mode:"auto",metric:"count",minFrp:0,d0:0,d1:0,sensor:null,dn:"all",days:[],
        bands:[],ptsMinZoom:null,available:{},timeKeys:[],timeline:null,breaks:null,
        offAgg:new Set(),offPts:new Set()};

// gpio records the zoom band of every aggregate level, and of the raw-point
// band, in the archive metadata. Read it rather than assume a threshold: the
// points band does not exist below its minzoom, so a viewer that guesses shows
// an empty map and looks broken.
async function loadBands(ds,url){
  try{
    const md=await new pmtiles.PMTiles(url).getMetadata();
    let py=md["gpio:pyramid"];
    if(typeof py==="string")py=JSON.parse(py);
    // Class breaks computed from the data at build time, keyed by the zoom
    // range of the band they describe. A fixed ramp cannot serve both a week
    // and a year: coarse cells here run an order of magnitude higher.
    let br=md["firms:breaks"];
    if(typeof br==="string"){ try{ br=JSON.parse(br); }catch{ br=null; } }
    S.breaks=br||null;

    // What the buckets ARE, declared by the archive that owns them. Never
    // infer the axis: reading it off a sampled feature is wrong because MVT
    // omits zero-valued attributes, and reading it off the width of a bucket
    // key only ever worked because two formats happened to differ in digits.
    let tl=md["firms:timeline"];
    if(typeof tl==="string"){ try{ tl=JSON.parse(tl); }catch{ tl=null; } }
    S.timeline=tl||null;

    const vl=md.vector_layers||JSON.parse(md.json||"{}").vector_layers||[];
    const agg=vl.find(l=>l.id===AGG_SRC_LAYER);
    S.timeKeys=agg?Object.keys(agg.fields||{})
      .filter(k=>/^count_\d{1,8}$/.test(k)).map(k=>k.slice(6)):[];
    if(py&&py.bands){
      S.bands=py.bands;
      const f=py.bands.find(b=>b.layer===PT_SRC_LAYER);
      // An archive with no point band has no zoom at which points exist, so
      // the cut is Infinity, not the 10 we assume for an archive that never
      // said. The all-time archive is aggregate-only; treating 10 as its cut
      // would hide the cells above z10 and draw nothing in their place.
      S.ptsMinZoom=f?f.minzoom:Infinity;
    }
    S.available[ds]=true;
  }catch(e){
    // A source whose archive never loads keeps MapLibre from ever reaching
    // "loaded", so `idle` never fires and every idle-driven readout stays at
    // its initial value. Do not register a dataset we could not read.
    S.available[ds]=false;
    console.warn("skipping "+ds+": archive unavailable", e);
  }
}
function bandAt(z){
  // Band edges are integers and MapLibre requests floor(zoom), so a fractional
  // zoom must floor too. Comparing 4.9 against a band ending at 4 and one
  // starting at 5 matches neither, and the legend silently loses its breaks.
  const iz=Math.floor(z);
  return (S.bands||[]).find(b=>iz>=b.minzoom&&(b.maxzoom==null||iz<=b.maxzoom));
}

const map=new maplibregl.Map({container:"map",hash:true,
  style:{
    version:8,
    glyphs:"https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
    sprite:"https://protomaps.github.io/basemaps-assets/sprites/v4/dark",
    sources:{protomaps:{type:"vector",url:"pmtiles://"+BASEMAP,
      attribution:'<a href="https://protomaps.com">Protomaps</a> &copy; <a href="https://openstreetmap.org">OpenStreetMap</a>'}},
    // layers() wants the theme OBJECT from namedTheme(), not the flavour name.
    // Passing the name returns layers whose paint colours are all undefined,
    // and MapLibre then rejects the style without loading anything.
    // The fire layers are added on load, so they sit above every basemap layer.
    layers:protomaps_themes_base.layers(
      "protomaps", protomaps_themes_base.namedTheme("dark"), {lang:"en"}),
  },
  center:[20,0],zoom:2,minZoom:-2,renderWorldCopies:true});
window._map=map;

const stepExpr=(expr,stops)=>{const e=["step",expr,stops[0][1]];
  for(let i=1;i<stops.length;i++)e.push(stops[i][0],stops[i][1]);return e;};
const step=(field,stops)=>stepExpr(["coalesce",["get",field],0],stops);
const fmt=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+"k":n;

// Which aggregate column currently represents "count", given the active facet.
// One pivot dimension at a time: the aggregate holds no cross-tabs.
const allDays=()=>S.days.length===0||(S.d0===0&&S.d1===S.days.length-1);
const selDays=()=>S.days.slice(S.d0,S.d1+1);

// A day RANGE has no single column: the cells hold one count per day, so the
// range is their sum. Summing in the style expression keeps it exact, because
// each day's count is a true count rather than a sample.
function activeCountExpr(){
  if(!allDays()){
    const cols=selDays().map(d=>["coalesce",["get","count_"+d],0]);
    return cols.length===1?cols[0]:["+"].concat(cols);
  }
  if(S.sensor) return ["coalesce",["get","count_"+S.sensor],0];
  if(S.dn!=="all") return ["coalesce",["get",S.dn==="D"?"count_d":"count_n"],0];
  return ["coalesce",["get","count"],0];
}
function activeCountLabel(){
  if(!allDays())   return `${selDays().length} day(s)`;
  if(S.sensor)     return "count_"+S.sensor;
  if(S.dn!=="all") return S.dn==="D"?"count_d":"count_n";
  return "count";
}
function facetCount(){
  return [!allDays()||null,S.sensor,S.dn!=="all"?S.dn:null].filter(Boolean).length;
}

// Sliders fire an input event per pixel of drag. Each apply() rebuilds a paint
// expression and resets a layer filter, which makes MapLibre re-evaluate every
// feature in every loaded tile, and rebuilds the panel DOM. Coalesce them: at
// most one update per animation frame.
let _pending = false;
function apply(){
  if(_pending) return;
  _pending = true;
  requestAnimationFrame(() => { _pending = false; applyNow(); });
}
function applyNow(){
  if(!map.getLayer(aggId()))return;
  const cexpr=activeCountExpr();
  const stops=shippedStops(S.metric)||RAMPS[S.metric].stops;
  const colorExpr = S.metric==="count"
    ? stepExpr(cexpr,stops)
    : step(S.metric,stops);

  map.setPaintProperty(aggId(),"fill-color",colorExpr);
  const aggValue = S.metric==="count" ? cexpr : ["coalesce",["get",S.metric],0];
  const aggFilter=["all",[">",cexpr,0]]
    .concat(hiddenClassFilters(aggValue, {stops}, S.offAgg));
  if(S.minFrp>0){
    const f=S.metric==="count"?"max_frp":S.metric;
    aggFilter.push([">=",["coalesce",["get",f],0],S.minFrp]);
  }
  map.setFilter(aggId(),aggFilter);

  if(map.getLayer(ptId())){
    map.setPaintProperty(ptId(),"circle-color",step("frp",RAMPS.frp.stops));
    const pf=["all"];
    if(S.minFrp>0)pf.push([">=",["coalesce",["get","frp"],0],S.minFrp]);
    if(!allDays()){
      pf.push([">=",["get","day"],selDays()[0]]);
      pf.push(["<=",["get","day"],selDays()[selDays().length-1]]);
    }
    if(S.sensor)pf.push(["==",["get","sensor"],SENSOR_VAL[S.sensor]]);
    if(S.dn!=="all")pf.push(["==",["get","daynight"],S.dn]);
    for(const f of hiddenClassFilters(["coalesce",["get","frp"],0],RAMPS.frp,S.offPts))
      pf.push(f);
    map.setFilter(ptId(),pf.length>1?pf:null);
  }

  renderLegend();

  const xn=document.getElementById("xnote");
  if(facetCount()>1){
    xn.style.display="block";
    xn.textContent="Aggregate cells hold one pivot per dimension, not cross-tabs. "+
      "With more than one facet active the cells show "+activeCountField()+
      " while the points honour every filter.";
  } else xn.style.display="none";
  renderControls();
  updateMode();
}

// Which ramp the map is actually drawing right now. The legend must follow the
// visible layer, not the aggregate metric: at point zooms the cells are gone
// and a count ramp would describe nothing on screen.
// Break set for the zoom on screen, or null to use the built-in ramp.
function shippedStops(metric){
  if(!S.breaks) return null;
  const z=map.getZoom();
  // Keyed by a5 level, so the classes hold steady across every zoom that draws
  // the same cells and only change when the cells themselves do. Older
  // archives keyed by zoom range are still read, below.
  const band=bandAt(z);
  const byLevel=band&&S.breaks["r"+band.level];
  const sets=byLevel?byLevel.metrics:null;
  if(sets){
    if(!sets[metric]) return null;
    const vals=sets[metric];
    const base=RAMPS[metric]?RAMPS[metric].stops:RAMPS.count.stops;
    return [[base[0][0], base[0][1]]].concat(
      vals.slice(0, base.length-1).map((v,i)=>[v, base[i+1][1]]));
  }
  for(const [range,sets] of Object.entries(S.breaks)){
    if(!/^\d+-\d+$/.test(range)) continue;
    const [lo,hi]=range.split("-").map(Number);
    if(z>=lo && z<=hi && sets && sets[metric]) {
      const vals=sets[metric];
      const base=RAMPS[metric]?RAMPS[metric].stops:RAMPS.count.stops;
      // Keep the palette, replace the thresholds. The first class starts at the
      // ramp's own floor so a cell with any detections is still coloured.
      return [[base[0][0], base[0][1]]].concat(
        vals.slice(0, base.length-1).map((v,i)=>[v, base[i+1][1]]));
    }
  }
  return null;
}

function activeRamp(){
  if(showingPoints()) return {key:"frp", ...RAMPS.frp, title:"Fire radiative power"};
  const shipped=shippedStops(S.metric);
  return {key:S.metric, ...RAMPS[S.metric],
          stops: shipped || RAMPS[S.metric].stops,
          title:document.querySelector(`#metric option[value="${S.metric}"]`).textContent
                + (shipped?" (data breaks)":"")};
}
function offSet(){ return showingPoints() ? S.offPts : S.offAgg; }

function renderLegend(){
  const r=activeRamp(), off=offSet();
  document.getElementById("lgtitle").textContent=r.title;
  // The colour-by select only applies to the aggregate cells.
  document.getElementById("metric").style.display=showingPoints()?"none":"";
  document.getElementById("lg").innerHTML=r.stops.map((st,i)=>{
    const hi=r.stops[i+1]?r.stops[i+1][0]:null;
    return `<div class="row${off.has(i)?" off":""}" data-i="${i}">`+
           `<span class="sw" style="background:${st[1]}"></span>`+
           `${fmt(st[0])}${hi?`–${fmt(hi)}`:"+"} ${r.unit}</div>`;}).join("");
}
document.getElementById("lg").onclick=e=>{
  const row=e.target.closest(".row"); if(!row)return;
  const i=+row.dataset.i, off=offSet();
  off.has(i)?off.delete(i):off.add(i);
  apply();
};

// Exclude every hidden class from a layer filter. A class is the half-open
// interval [lo, hi) of the ramp; the last one has no upper bound.
function hiddenClassFilters(valueExpr, ramp, off){
  const out=[];
  for(const i of off){
    const lo=ramp.stops[i][0], hi=ramp.stops[i+1]?ramp.stops[i+1][0]:null;
    out.push(hi===null ? ["!",[">=",valueExpr,lo]]
                       : ["!",["all",[">=",valueExpr,lo],["<",valueExpr,hi]]]);
  }
  return out;
}
function showingPoints(){
  const z=map.getZoom(), cut=S.ptsMinZoom==null?10:S.ptsMinZoom;
  if(S.mode==="agg")return false;
  if(S.mode==="pts")return z>=cut;
  return z>=cut;
}

function updateMode(){
  const z=map.getZoom();
  const cut=S.ptsMinZoom==null?10:S.ptsMinZoom;
  const ptsHere=z>=cut;
  let showAgg,showPts;
  if(S.mode==="auto"){showAgg=!ptsHere;showPts=ptsHere;}
  else if(S.mode==="agg"){showAgg=true;showPts=false;}
  else {showAgg=false;showPts=ptsHere;}
  if(map.getLayer(aggId()))map.setLayoutProperty(aggId(),"visibility",showAgg?"visible":"none");
  if(map.getLayer(ptId()))map.setLayoutProperty(ptId(),"visibility",showPts?"visible":"none");
  const b=bandAt(z);
  const lbl=showAgg?(b&&b.level!=="features"?`aggregate r${b.level}`:"aggregate")
                   :(showPts?"points":"—");
  document.getElementById("showing").textContent=lbl;
  const w=document.getElementById("zwarn");
  if(S.mode==="pts"&&!ptsHere){
    w.style.display="block";
    w.textContent=cut===Infinity
      ? `This archive is aggregate-only — it carries no raw points at any zoom, `+
        `so nothing draws in Points mode. Switch to Aggregate, or pick a dataset `+
        `whose pyramid has a features band.`
      : `Raw points start at zoom ${cut}. This archive carries no point `+
        `band below that, so nothing draws here. Zoom in, or rebuild with a lower `+
        `--features-min-zoom.`;
  } else w.style.display="none";
}

// Build (or rebuild) the fire source and its two layers for the active dataset.
async function mountDataset(){
  for(const id of [PT_LAYER, AGG_LAYER]) if(map.getLayer(id)) map.removeLayer(id);
  if(map.getSource(SRC)) map.removeSource(SRC);
  S.bands=[]; S.ptsMinZoom=null; S.days=[]; S.d0=0; S.d1=0; S.timeline=null;

  const url = DATASETS[S.dataset].tiles;
  await loadBands(S.dataset, url);
  if(!S.available[S.dataset]){
    // Nothing was mounted, so no map event follows to refresh the readouts.
    // Say the archive is missing rather than leaving the previous dataset's
    // numbers on screen, where they read as this dataset's.
    document.getElementById("hdsub").textContent =
      DATASETS[S.dataset].label + " · archive unavailable";
    document.getElementById("ncells").textContent="0";
    document.getElementById("nf").textContent="0";
    renderControls();
    return;
  }

  map.addSource(SRC,{type:"vector",url:"pmtiles://"+url});
  map.addLayer({id:AGG_LAYER,type:"fill",source:SRC,"source-layer":AGG_SRC_LAYER,
    layout:{visibility:"none"},
    paint:{"fill-color":step("count",RAMPS.count.stops),"fill-opacity":.74,
           "fill-outline-color":"rgba(0,0,0,.22)"}});
  // Skip the point layer entirely where the pyramid declares no features band:
  // the source-layer does not exist in those tiles, and a layer bound to a
  // missing source-layer is a permanently empty layer the mode switch can
  // still select.
  if(S.ptsMinZoom!==Infinity)
    map.addLayer({id:PT_LAYER,type:"circle",source:SRC,"source-layer":PT_SRC_LAYER,
      layout:{visibility:"none"},
      paint:{"circle-radius":["interpolate",["linear"],["zoom"],9,1.6,12,3,15,5.5],
             "circle-color":step("frp",RAMPS.frp.stops),"circle-opacity":.9}});
  // Months arrive unpadded (count_1 … count_12) in the oldest archives, so sort
  // numerically where the keys are numeric-width, lexically where they are dates.
  const k=S.timeKeys.slice();
  S.days = k.every(x=>x.length<=2) ? k.sort((a,b)=>+a-+b) : k.sort();
  S.d0=0; S.d1=Math.max(0,S.days.length-1);

  showSummary();
  renderControls(); applyNow();
  // Mounting is not itself a map event, and if the tiles are already cached no
  // moveend or sourcedata follows, so ask for the readout directly.
  scheduleReadout();
}

// A bucket key spelled out as a date. Which unit the archive counts in comes
// from firms:timeline; this only decides how to punctuate a key we already
// hold, and the two published formats are count_YYYYMM and count_YYYYMMDD.
const bucketDay = k => k.length>=8
  ? `${k.slice(0,4)}-${k.slice(4,6)}-${k.slice(6,8)}`
  : `${k.slice(0,4)}-${k.slice(4,6)}`;

// Header text for the active dataset. A year carries its own range and count
// from its STAC item. The all-time archive spans the whole record, so the
// collection's extent describes it exactly. The rolling window has neither an
// item nor a collection that describes only it — the collection now covers all
// 27 years — so it reports the span of the buckets the archive actually holds.
async function showSummary(){
  const d = DATASETS[S.dataset];
  const el = document.getElementById("hdsub");
  if(d.summary){ el.textContent = d.summary; return; }
  if(d.collection){
    el.textContent = "loading…";
    try{
      const c = await (await fetch(d.collection)).json();
      const iv = ((c.extent||{}).temporal||{}).interval||[[null,null]];
      const day = t => t ? t.slice(0,10) : "?";
      el.textContent = `${day(iv[0][0])} → ${day(iv[0][1])} · `+
                       `${(c["table:row_count"]||0).toLocaleString()} detections`;
    }catch{ el.textContent = d.label; }
    return;
  }
  const k = S.days;
  el.textContent = k.length
    ? `${bucketDay(k[0])} → ${bucketDay(k[k.length-1])}` : d.label;
}

// Start discovery before the map is ready so the catalog fetch and the style
// load overlap; the first mount waits on it so the selector is complete before
// anything is chosen.
const discovered = discoverYears();
map.on("load", async () => {
  await discovered;
  renderDatasetControl();
  await mountDataset();
});

// Twenty-seven years do not fit a row of buttons, so past a handful the
// control becomes a <select>. Rebuilt from DATASETS, never edited in place.
const DATASET_SELECT_ABOVE = 8;
let _dsSig = null;
function renderDatasetControl(){
  const host = document.getElementById("dataset");
  const keys = DATASET_KEYS;
  // renderControls() runs on every coalesced slider frame. Rebuilding a
  // <select>'s DOM mid-interaction shuts its dropdown, so redraw only when
  // something the control actually shows has changed.
  const sig = JSON.stringify([keys, S.dataset, keys.map(k=>S.available[k]!==false)]);
  if(sig === _dsSig) return;
  _dsSig = sig;
  host.innerHTML = "";
  if(keys.length > DATASET_SELECT_ABOVE){
    host.className = "";                       // .seg is a button row, not a select
    const sel = document.createElement("select");
    for(const k of keys){
      const o = document.createElement("option");
      o.value = k;
      o.textContent = DATASETS[k].label;
      o.disabled = S.available[k] === false;
      sel.appendChild(o);
    }
    sel.value = S.dataset;
    sel.onchange = () => selectDataset(sel.value);
    host.appendChild(sel);
    return;
  }
  host.className = "seg";
  for(const k of keys){
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = DATASETS[k].label;
    b.className = k === S.dataset ? "on" : "";
    const ok = S.available[k] !== false;
    b.disabled = !ok;
    b.style.opacity = ok ? "" : "0.4";
    b.title = ok ? "" : "archive unavailable";
    b.onclick = () => selectDataset(k);
    host.appendChild(b);
  }
}
function selectDataset(key){
  if(!key || key === S.dataset) return;
  S.dataset = key;
  renderDatasetControl();
  mountDataset();
}
renderDatasetControl();   // the two known archives show before discovery lands

// The chip DOM is rendered FROM state, never edited independently. An earlier
// version toggled classes on click and separately re-rendered on discovery,
// which let the visible selection and S drift apart.
function renderControls(){
  const n=S.days.length;
  // The archive declares its own unit. The old guess read key width, which
  // called the all-time archive's six-digit YYYYMM buckets "Days". An archive
  // that declares nothing gets a neutral label rather than a fresh guess.
  const gran = S.timeline ? (S.timeline.unit==="month" ? "Months" : "Days") : "Time";
  const gl=document.getElementById("daylabel"); if(gl) gl.textContent=gran;
  const d0=document.getElementById("d0"), d1=document.getElementById("d1");
  if(n){
    d0.max=d1.max=String(n-1);
    d0.value=String(S.d0); d1.value=String(S.d1);
    const pct=i=>n>1?(i/(n-1))*100:0;
    const f=document.getElementById("dfill");
    f.style.left=pct(S.d0)+"%"; f.style.right=(100-pct(S.d1))+"%";
    const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    // Punctuation only, off the key's own width: YYYYMMDD as MM/DD, YYYYMM as
    // "Sep 20" — a 27-year archive needs the year to tell its months apart —
    // and the bare 1…12 the oldest single-year builds used.
    const fmt=d=> d.length<=2 ? (MON[+d-1]||d)
                : d.length>=8  ? `${d.slice(4,6)}/${d.slice(6,8)}`
                :                `${MON[+d.slice(4,6)-1]||d.slice(4,6)} ${d.slice(2,4)}`;
    document.getElementById("dayrange").textContent=
      allDays()?"all":(S.d0===S.d1?fmt(S.days[S.d0]):`${fmt(S.days[S.d0])} – ${fmt(S.days[S.d1])}`);
    document.getElementById("dlo").textContent=fmt(S.days[0]);
    document.getElementById("dhi").textContent=fmt(S.days[n-1]);
  }
  document.querySelectorAll("#mode button").forEach(b=>
    b.classList.toggle("on", b.dataset.m===S.mode));
  renderDatasetControl();
  document.querySelectorAll("#dn button").forEach(b=>
    b.classList.toggle("on", b.dataset.v===S.dn));
  document.getElementById("metric").value=S.metric;
  const sc=document.getElementById("sensors");
  sc.innerHTML=[`<span class="chip${S.sensor?"":" on"}" data-s="">All</span>`]
    .concat(SENSORS.map(([k,l])=>
      `<span class="chip${S.sensor===k?" on":""}" data-s="${k}">${l}</span>`))
    .join("");
}
for(const id of ["d0","d1"]){
  document.getElementById(id).oninput=e=>{
    let a=+document.getElementById("d0").value, b=+document.getElementById("d1").value;
    if(id==="d0"&&a>b)b=a; if(id==="d1"&&b<a)a=b;      // thumbs may not cross
    S.d0=a; S.d1=b; apply();
  };
}
document.getElementById("sensors").onclick=e=>{
  const v=e.target.dataset.s; if(v===undefined)return;
  S.sensor=v||null; apply();
};

document.getElementById("mode").onclick=e=>{
  if(!e.target.dataset.m)return; S.mode=e.target.dataset.m; apply();};
document.getElementById("dn").onclick=e=>{
  if(!e.target.dataset.v)return; S.dn=e.target.dataset.v; apply();};
document.getElementById("metric").onchange=e=>{
  S.metric=e.target.value; S.offAgg.clear();   // buckets mean something else now
  apply();};
document.getElementById("frp").oninput=e=>{
  S.minFrp=+e.target.value;
  document.getElementById("frpv").textContent=S.minFrp+" MW";apply();};

let lastPts=null, lastStops=null;
map.on("move",()=>{
  document.getElementById("z").textContent=map.getZoom().toFixed(1);
  updateMode();
  const nowPts=showingPoints();
  const nowStops=JSON.stringify(shippedStops(S.metric));
  if(nowPts!==lastPts||nowStops!==lastStops){lastPts=nowPts;lastStops=nowStops;apply();}
});
// Do not hang the readouts on `idle`. Any source that never finishes — a 404
// archive, a basemap hitting network errors — keeps the map from reaching
// "loaded", and idle then never fires. moveend/sourcedata always do.
let _readoutPending=false;
function scheduleReadout(){
  if(_readoutPending) return;
  _readoutPending=true;
  setTimeout(()=>{ _readoutPending=false; updateReadouts(); }, 200);
}
map.on("moveend", scheduleReadout);
map.on("sourcedata", e => { if(e.isSourceLoaded) scheduleReadout(); });
map.on("idle", scheduleReadout);
function updateReadouts(){
  try{
    const ly=[aggId(),ptId()].filter(l=>map.getLayer(l)&&
      map.getLayoutProperty(l,"visibility")!=="none");
    if(!ly.length){
      document.getElementById("nf").textContent="0";
      document.getElementById("ncells").textContent="0";
      return;
    }
    // One query serves both readouts. querySourceFeatures returns nothing for
    // these pyramids, so day discovery reads rendered features too.
    const feats=map.queryRenderedFeatures({layers:ly});
    document.getElementById("nf").textContent=feats.length.toLocaleString();
    const aggOnly=map.getLayer(aggId())&&
      map.getLayoutProperty(aggId(),"visibility")!=="none"
        ? map.queryRenderedFeatures({layers:[aggId()]}).length : 0;
    document.getElementById("ncells").textContent=aggOnly.toLocaleString();


  }catch(e){ console.warn("readout failed", e); }
}

map.on("click",e=>{
  const ly=[aggId(),ptId()].filter(l=>map.getLayer(l)&&
    map.getLayoutProperty(l,"visibility")!=="none");
  const f=map.queryRenderedFeatures(e.point,{layers:ly});
  const pop=document.getElementById("pop");
  if(!f.length){pop.style.display="none";return;}
  const p=f[0].properties;
  document.getElementById("pt").innerHTML=Object.entries(p)
    .filter(([k,v])=>k!=="a5_cell"&&v!==0&&v!==null&&v!=="")
    .slice(0,16)
    .map(([k,v])=>`<tr><td>${k}</td><td>${typeof v==="number"
      ?(+v).toLocaleString(undefined,{maximumFractionDigits:2}):v}</td></tr>`).join("");
  pop.style.display="block";
});
</script></body></html>
