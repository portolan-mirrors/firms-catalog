<!doctype html><html><head><meta charset="utf-8">
<title>FIRMS explorer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.0/dist/pmtiles.js"></script>
<script src="https://unpkg.com/protomaps-themes-base@4.5.0/dist/protomaps-themes-base.js"></script>
<style>
 :root{--bg:#0d1117;--panel:#12171f;--inset:#0b0f15;--line:#2b3440;--fg:#e6edf3;
       --dim:#8b949e;--acc:#f78166;--warn:#d29922}
 *{box-sizing:border-box}
 html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
   font:12.5px/1.45 ui-sans-serif,-apple-system,"Segoe UI",sans-serif}
 body{display:flex;flex-direction:column}
 /* min-height:0 or the flex item refuses to shrink and the dock is pushed off
    the bottom of the viewport. */
 .stage{flex:1;min-height:0;position:relative}
 #map{position:absolute;inset:0}
 .over{position:absolute;top:10px;left:10px;width:236px;background:var(--panel);
   border:1px solid var(--line);border-radius:11px;z-index:3;
   box-shadow:0 10px 34px rgba(0,0,0,.6);max-height:calc(100% - 20px);overflow:auto}
 .over .hd{padding:11px 13px 9px;border-bottom:1px solid var(--line)}
 .over h1{margin:0;font-size:13px}
 .over .sub{color:var(--dim);font-size:10.5px;margin-top:2px}
 .sec{padding:10px 13px;border-bottom:1px solid var(--line)}
 .sec:last-child{border-bottom:0}
 .dock{border-top:1px solid var(--line);background:var(--panel);
   box-shadow:0 -10px 34px rgba(0,0,0,.6)}
 .bar{display:flex;gap:10px;align-items:center;padding:9px 12px;flex-wrap:wrap}
 .grp{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dim)}
 .seg{display:flex;background:var(--inset);border:1px solid var(--line);
   border-radius:7px;overflow:hidden}
 .seg button{background:none;border:0;color:var(--dim);padding:5px 10px;
   font:inherit;font-size:11px;cursor:pointer}
 .seg button.on{background:var(--acc);color:var(--panel);font-weight:600}
 .seg button:hover:not(.on){color:var(--fg)}
 select{background:var(--inset);color:var(--fg);border:1px solid var(--line);
   border-radius:6px;padding:4px 7px;font:inherit;font-size:11.5px}
 .kv{font-size:10.5px;color:var(--dim)}
 .kv b{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
 .row{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);padding:1px 0}
 .row b{color:var(--fg);font-variant-numeric:tabular-nums;font-weight:600}
 .spacer{flex:1}
 .note{font-size:10px;color:var(--warn);line-height:1.35;padding:0 12px 8px;display:none}
 .over .note{padding:6px 0 0;display:block}
 .legend{display:flex;flex-direction:column;gap:2px}
 .lgrow{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--dim)}
 .sw{width:15px;height:10px;border-radius:2px;flex:none}
 #track{display:block;width:100%;height:104px;outline:none}
 #track:focus-visible{box-shadow:inset 0 0 0 1px var(--acc)}
 .hint{background:none;border:0;color:var(--acc);font:inherit;font-size:10.5px;
   cursor:pointer;padding:0;text-decoration:underline;display:none}
 .dt{background:var(--inset);color:var(--fg);border:1px solid var(--line);
   border-radius:4px;font:inherit;font-variant-numeric:tabular-nums;
   padding:2px 4px;min-width:8.5em}
 .dt:focus{outline:none;border-color:var(--acc)}
 /* The native indicator is near-invisible on a dark ground. */
 .dt::-webkit-calendar-picker-indicator{filter:invert(.75);cursor:pointer}
 .arrow{color:var(--dim);margin:0 .2em}
 #pop{position:absolute;right:10px;top:10px;width:212px;background:var(--panel);
   border:1px solid var(--line);border-radius:11px;padding:10px 12px;z-index:3;display:none}
 #pop .x{float:right;cursor:pointer;color:var(--dim)}
</style></head><body>

<div class="stage">
  <div id="map"></div>
  <div class="over">
    <div class="hd"><h1>FIRMS explorer</h1>
      <div class="sub" id="hdsub">loading…</div></div>
    <div class="sec">
      <div class="grp" id="lgtitle">Detections in selection</div>
      <div class="legend" id="lg" style="margin-top:7px"></div>
      <div class="note" id="lgnote"></div>
    </div>
    <div class="sec">
      <div class="row"><span>zoom</span><b id="z">–</b></div>
      <div class="row"><span id="nlabel">cells in view</span><b id="ncells">–</b></div>
      <div class="row"><span>histogram</span><b id="ms">–</b></div>
    </div>
  </div>
  <div id="pop"><span class="x" id="popx">✕</span>
    <div class="grp">Cell</div><table id="pt" style="width:100%;border-collapse:collapse;
      font-size:10.5px;margin-top:6px"></table></div>
</div>

<div class="dock">
  <div class="bar">
    <span class="grp">Archive</span>
    <select id="archive"></select>
    <button class="hint" id="fits"></button>
    <span class="grp">Span</span>
    <div class="seg" id="presets"></div>
    <div class="seg">
      <button id="zin" title="Zoom in around the selection">+</button>
      <button id="zout" title="Zoom out around the selection">−</button>
      <button id="fit" title="Fit the view to the selection (F)">Fit</button>
    </div>
    <span class="spacer"></span>
    <span class="kv">selection
      <input id="selfrom" class="dt" aria-label="Selection start">
      <span class="arrow">→</span>
      <input id="selto" class="dt" aria-label="Selection end">
    </span>
    <span class="kv">view <b id="view">–</b></span>
    <span class="kv">buckets <b id="nb">–</b></span>
  </div>
  <div class="note" id="note"></div>
  <canvas id="track" tabindex="0"
    aria-label="Time axis. Left and right arrows step the selection; hold shift to extend it."></canvas>
</div>

<script type="module">
import {Timeline, makeAxis, formatKey, keyToISO, isoToKey, COUNT_RAMP}
  from "./timeline.js";
import {bandAt, chooseArchive, parseJSONish, pointsMinZoom, pyramid,
        shippedStops, timelineFromMetadata} from "./archives.js";

maplibregl.addProtocol("pmtiles", new pmtiles.Protocol().tile);

// Where the tiles live. Defaults to the published archives so the hosted app
// needs no configuration; ?base=… points it at a local build.
const qs = new URLSearchParams(location.search);
const BASE = qs.get("base") ||
  "https://data.source.coop/portolan-mirrors/firms-catalog/detections";
// Protomaps' OpenStreetMap basemap, on the same origin as the data, so the
// background comes from Source Cooperative rather than a third party.
const BASEMAP = "https://data.source.coop/protomaps/openstreetmap/tiles/v3.pmtiles";

const SRC = "fire", AGG = "agg", PTS = "pts";
const AGG_LAYER = "aggregate", PT_LAYER = "features";
const el = id => document.getElementById(id);

// The two archives with no STAC item of their own. Every year comes from the
// catalog in discoverYears(), so a newly tiled year appears without an edit.
const ARCHIVES = {
  alltime: {label: "All time · monthly", url: `${BASE}/alltime.pmtiles`,
            presets: [["1y", 12], ["5y", 60], ["all", null]]},
  latest:  {label: "Last 7 days · daily", url: `${BASE}/fire-latest.pmtiles`,
            presets: [["all", null]]},
};
// Display order, kept beside ARCHIVES rather than read off it. A year id like
// "2020" is an array-index-like key, and JavaScript enumerates those first and
// in ascending numeric order however they were inserted, so Object.keys()
// would put 2000 above the all-time archive.
const ORDER = ["alltime", "latest"];
const UNIT_ADVERB = {day: "daily", month: "monthly"};

// Point the app at an archive that is not in the catalog yet:
//
//   ?add=2020|./fire-2020.pmtiles          (repeatable)
//
// Year archives are discovered from their STAC items, so a year appears only
// once its tileset is published. This is how you drive one before that, and it
// is why the dev server has to be the range-capable serve.py -- python's
// http.server answers 200 to a Range request and hands back the whole file,
// which leaves PMTiles parsing megabytes of the wrong bytes and rendering
// nothing, with no error to explain it.
for (const spec of qs.getAll("add")) {
  const i = spec.indexOf("|");
  if (i < 1) continue;
  const id = spec.slice(0, i), url = spec.slice(i + 1);
  ARCHIVES[id] = {label: `${id} · daily (local)`, url,
                  presets: [["7d", 7], ["30d", 30], ["90d", 90], ["all", null]]};
  if (!ORDER.includes(id)) ORDER.push(id);
}

let S = {
  id: null, axis: null, meta: null, columns: new Set(), declared: true,
  bands: [], breaks: null, ptsMinZoom: Infinity, available: {},
  sel: {from: 0, to: 0}, cells: new Map(), lastLevel: null,
};

// -------------------------------------------------------------- discovery

/**
 * A cheap reachability probe.
 *
 * A source that 404s keeps MapLibre from ever reaching `loaded`, so `idle`
 * never fires and every idle-driven readout freezes at its initial value. That
 * failure has already happened here, so nothing is put in the style until it
 * has been shown to answer. A STAC item advertising a `pmtiles` asset is not
 * proof the archive exists: 2020's item carries one today and the file is
 * still being built.
 */
async function reachable(url) {
  try {
    const r = await fetch(url, {headers: {Range: "bytes=0-127"}});
    return r.ok;            // 206 for a served range, 200 if ranges are ignored
  } catch {
    return false;
  }
}

async function discoverYears() {
  const collUrl = `${BASE}/collection.json`;
  let coll;
  try {
    coll = await (await fetch(collUrl)).json();
  } catch (e) {
    console.warn("collection unavailable; the year list stays empty", e);
    return;
  }
  const items = (coll.links || []).filter(l => l.rel === "item");
  const found = await Promise.all(items.map(async l => {
    // Resolve against the URL the href was read from. Item hrefs are relative
    // ("./year=2020/2020.json") and so are the asset hrefs inside each item;
    // joining the strings by hand puts the archive in the wrong directory.
    const href = new URL(l.href, collUrl).toString();
    try {
      const item = await (await fetch(href)).json();
      const asset = (item.assets || {}).pmtiles;
      if (!asset) return null;                    // published, not yet tiled
      const url = new URL(asset.href, href).toString();
      if (!await reachable(url)) {
        console.warn(`${item.id} advertises a pmtiles asset that 404s; skipping`);
        return null;
      }
      return {id: item.id, url, label: `${item.id} · daily`,
              presets: [["7d", 7], ["30d", 30], ["90d", 90], ["all", null]]};
    } catch (e) {
      console.warn("skipping item " + href, e);
      return null;
    }
  }));
  // Newest first: the recent years are the ones anyone reaches for.
  for (const y of found.filter(Boolean).sort((a, b) => b.id.localeCompare(a.id))) {
    ARCHIVES[y.id] = y;
    ORDER.push(y.id);
  }
}

// ------------------------------------------------------------------- the map

const map = new maplibregl.Map({
  container: "map", hash: true,
  style: {
    version: 8,
    glyphs: "https://protomaps.github.io/basemaps-assets/fonts/{fontstack}/{range}.pbf",
    sprite: "https://protomaps.github.io/basemaps-assets/sprites/v4/dark",
    sources: {protomaps: {type: "vector", url: "pmtiles://" + BASEMAP,
      attribution: '<a href="https://protomaps.com">Protomaps</a> &copy; ' +
                   '<a href="https://openstreetmap.org">OpenStreetMap</a>'}},
    // layers() wants the theme OBJECT from namedTheme(), not the flavour name.
    // Passing the name returns layers whose paint colours are all undefined,
    // and MapLibre then rejects the style without loading anything.
    layers: protomaps_themes_base.layers(
      "protomaps", protomaps_themes_base.namedTheme("dark"), {lang: "en"}),
  },
  // z0 of the all-time archive is the whole world at r4 carrying every month,
  // and 1.25 MB. Opening at z2 means it is never requested.
  center: [20, 10], zoom: 2, minZoom: 0, renderWorldCopies: true,
});
window._map = map;

/** Read an archive's own description of itself, or nothing if it will not load. */
async function readArchive(url) {
  const md = await new pmtiles.PMTiles(url).getMetadata();
  const py = pyramid(md);
  const tl = timelineFromMetadata(md);
  return {
    md, bands: py.bands, breaks: parseJSONish(md["firms:breaks"]),
    ptsMinZoom: pointsMinZoom(py.bands),
    meta: tl.meta, declared: tl.declared, columns: new Set(tl.columns),
  };
}

async function mount(id) {
  const arc = ARCHIVES[id];
  if (!arc) return;
  for (const l of [PTS, AGG]) if (map.getLayer(l)) map.removeLayer(l);
  if (map.getSource(SRC)) map.removeSource(SRC);
  S.cells.clear();
  S.id = id;
  el("archive").value = id;
  el("hdsub").textContent = "reading " + arc.label + "…";

  let read;
  try {
    read = await readArchive(arc.url);
  } catch (e) {
    // Nothing was mounted, so no map event follows to refresh the readouts.
    S.available[id] = false;
    renderArchiveControl();
    console.warn("archive unavailable: " + arc.url, e);
    el("hdsub").textContent = arc.label + " · archive unavailable";
    el("ncells").textContent = "0";
    el("ms").textContent = "–";
    return;
  }
  if (!read.meta) {
    el("hdsub").textContent = arc.label + " · no time axis declared";
    console.warn("archive declares no firms:timeline and carries no bucket " +
                 "columns; there is no axis to draw", arc.url);
    return;
  }
  S.available[id] = true;
  Object.assign(S, read);
  S.axis = makeAxis(read.meta);
  S.lastLevel = null;

  map.addSource(SRC, {type: "vector", url: "pmtiles://" + arc.url});
  map.addLayer({id: AGG, type: "fill", source: SRC, "source-layer": AGG_LAYER,
    paint: {"fill-color": "rgba(0,0,0,0)", "fill-opacity": .74,
            "fill-outline-color": "rgba(0,0,0,0)"}});
  // Skip the point layer where the pyramid declares no features band: the
  // source-layer does not exist in those tiles, and a layer bound to a missing
  // source-layer is a permanently empty layer.
  if (read.ptsMinZoom !== Infinity)
    map.addLayer({id: PTS, type: "circle", source: SRC, "source-layer": PT_LAYER,
      paint: {"circle-radius": ["interpolate", ["linear"], ["zoom"], 9, 1.6, 12, 3, 15, 5.5],
              "circle-color": "#f2b134", "circle-opacity": .85}});

  // Mount the axis with no values: the counts are viewport-dependent and are
  // not known until tiles have loaded. The bars fill in on the first idle.
  tl.metricLabel = "detections";
  tl.setSource(read.meta, {});

  el("nb").textContent =
    `${S.axis.count} ${S.axis.unit}${S.axis.count === 1 ? "" : "s"}`;
  el("z").textContent = map.getZoom().toFixed(1);
  el("presets").innerHTML = (arc.presets || [["all", null]])
    .map(([lbl, n]) => `<button data-n="${n == null ? "" : n}">${lbl}</button>`)
    .join("");
  syncInputs();
  renderArchiveControl();
  showNotes(arc, read);
  applySelection();
  // Mounting is not a map event, and if the tiles are already cached no
  // moveend or sourcedata follows, so ask for the histogram directly.
  scheduleHistogram();
}

function showNotes(arc, read) {
  el("hdsub").textContent =
    `${formatKey(S.axis.min, S.axis.unit)} → ${formatKey(S.axis.max, S.axis.unit)} · ` +
    // "day" + "ly" is "dayly". English adverbs are not a string concat, and
    // the unit set is small enough to just name them.
    `${UNIT_ADVERB[S.axis.unit] || S.axis.unit} buckets`;
  const msgs = [];
  if (!read.declared)
    msgs.push(`${arc.label} declares no firms:timeline; the axis was ` +
              `reconstructed from the ${read.columns.size} bucket columns the ` +
              `aggregate layer lists.`);
  if (S.axis.declaredBuckets !== S.axis.count)
    msgs.push(`firms:timeline declares ${S.axis.declaredBuckets} buckets but ` +
              `${S.axis.min}–${S.axis.max} spans ${S.axis.count}. ` +
              `The gap is drawn empty.`);
  const note = el("note");
  note.style.display = msgs.length ? "block" : "none";
  note.textContent = msgs.join(" ");
}

// ------------------------------------------------- colouring by the selection

// The bucket keys the selection covers that the archive actually carries a
// column for. Absent buckets are skipped rather than emitted as a `coalesce`
// of a missing property: the expression is already up to 311 terms wide.
function selectedColumns() {
  if (!S.axis) return [];
  const out = [];
  for (let i = S.sel.from; i <= S.sel.to; i++) {
    const k = S.axis.keyAt(i);
    if (S.columns.has(k)) out.push(k);
  }
  return out;
}

const wholeAxis = () =>
  S.axis && S.sel.from <= 0 && S.sel.to >= S.axis.count - 1;

/**
 * A cell's detections within the selection.
 *
 * `count` is the cell's total and equals the sum of its bucket columns, so the
 * whole-axis case collapses to one property read instead of 311 adds. Any
 * narrower selection has no precomputed column and must be summed in the
 * expression, which stays exact because each bucket holds a true count.
 */
function countExpr(cols) {
  if (wholeAxis()) return ["coalesce", ["get", "count"], 0];
  if (!cols.length) return 0;
  if (cols.length === 1) return ["coalesce", ["get", "count_" + cols[0]], 0];
  return ["+"].concat(cols.map(k => ["coalesce", ["get", "count_" + k], 0]));
}

function currentStops(cols) {
  const band = bandAt(S.bands, map.getZoom());
  // The shipped breaks describe a cell's total over the whole archive. One
  // month of 311 coloured by them puts every cell in the bottom class and
  // paints the map flat, so the thresholds are scaled by the share of the
  // record on screen. At full span the scale is 1 and the shipped breaks are
  // used exactly as published.
  const scale = wholeAxis() || !S.axis
    ? 1 : cols.length / Math.max(1, S.axis.declaredBuckets);
  const stops = band
    ? shippedStops(S.breaks, band.level, "count", COUNT_RAMP, scale) : null;
  return {band, scale, stops: stops || COUNT_RAMP};
}

// Dragging a selection handle emits a change per pointer move. Rebuilding a
// paint expression makes MapLibre re-evaluate every feature in every loaded
// tile, so coalesce to at most one update per frame. Note this sets paint
// properties only: a setFilter would re-layout the layer, which is far more
// expensive and visibly janky mid-drag.
// Repainting the map costs O(cells x selected buckets) inside MapLibre's
// expression evaluator, and a drag emits one change per pointer move. At a
// wide selection that produced frames of up to 298 ms and the map crawled
// through the backlog long after the pointer stopped.
//
// Precomputing the sums in JS and feeding them through feature-state was
// measured and was far worse -- 16 s for the same drag -- because setting
// state on every cached cell every frame costs more than the expression it
// replaces. So the map is throttled instead of made cleverer: at most one
// repaint per MAP_THROTTLE_MS while a gesture is live, and always one final
// repaint when it ends, which is the only frame the user waits to see. The
// timeline keeps redrawing every frame, so the gesture still feels immediate.
const MAP_THROTTLE_MS = 110;
let _pending = false, _lastPaint = 0, _trailing = null;
function applySelection(dragging) {
  if (!dragging) {
    if (_trailing) { clearTimeout(_trailing); _trailing = null; }
    if (_pending) return;
    _pending = true;
    requestAnimationFrame(() => { _pending = false; _lastPaint = performance.now(); applyNow(); });
    return;
  }
  const since = performance.now() - _lastPaint;
  if (since >= MAP_THROTTLE_MS) {
    if (_pending) return;
    _pending = true;
    requestAnimationFrame(() => { _pending = false; _lastPaint = performance.now(); applyNow(); });
    return;
  }
  // Mid-throttle: make sure the last position still lands even if no further
  // event arrives, or releasing the pointer would leave the map a frame stale.
  if (_trailing) return;
  _trailing = setTimeout(() => {
    _trailing = null; _lastPaint = performance.now(); applyNow();
  }, MAP_THROTTLE_MS - since);
}

function applyNow() {
  if (!map.getLayer(AGG) || !S.axis) return;
  const cols = selectedColumns();
  const expr = countExpr(cols);
  const {band, scale, stops} = currentStops(cols);
  S.lastLevel = band ? band.level : null;

  // A cell with nothing in the selection is drawn as nothing rather than
  // filtered out, because a filter change re-lays out the layer and a paint
  // change does not. The outline follows the same test or every empty cell
  // would leave its border behind as a grid of noise.
  const fill = ["step", expr, "rgba(0,0,0,0)"];
  for (const [t, c] of stops) fill.push(t, c);
  map.setPaintProperty(AGG, "fill-color", fill);
  map.setPaintProperty(AGG, "fill-outline-color",
    ["step", expr, "rgba(0,0,0,0)", stops[0][0], "rgba(0,0,0,.28)"]);

  if (map.getLayer(PTS)) {
    // Raw points carry the day they were seen, not a bucket column, and the
    // property is a string in some builds and a number in others. Coercing
    // once inside the expression keeps one filter correct for both.
    map.setFilter(PTS, wholeAxis() || !cols.length ? null
      : ["match", ["to-string", ["get", "day"]], cols, true, false]);
  }
  renderLegend(stops, scale, cols.length);
}

const fmt = n => n >= 1e6 ? (n / 1e6).toFixed(1) + "M"
  : n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n);

function renderLegend(stops, scale, nsel) {
  el("lg").innerHTML = stops.map((st, i) => {
    const hi = stops[i + 1] ? stops[i + 1][0] : null;
    return `<div class="lgrow"><span class="sw" style="background:${st[1]}"></span>` +
           `${fmt(st[0])}${hi ? `–${fmt(hi)}` : "+"}</div>`;
  }).join("");
  const band = bandAt(S.bands, map.getZoom());
  // The points band's level is the string "features", not a number, so it is
  // neither an "r" resolution nor made of cells.
  el("lgtitle").textContent =
    !band ? "Detections"
    : band.layer === PT_LAYER ? "Detections · individual"
    : `Detections · r${band.level} cells`;
  const n = el("lgnote");
  if (!S.breaks) {
    n.textContent = "This archive ships no firms:breaks; the built-in ramp is used.";
  } else if (scale === 1) {
    n.textContent = "Shipped data breaks, whole record.";
  } else {
    n.textContent = `Shipped data breaks scaled to the ${nsel} of ` +
      `${S.axis.declaredBuckets} buckets selected.`;
  }
}

// ------------------------------------------------------------ the histogram

const BUCKET_KEY = /^\d{6}$|^\d{8}$/;

/**
 * The bar palette, rescaled to the histogram on screen.
 *
 * The map's shipped breaks cannot be reused here: they classify one cell's
 * total, and a bar is the sum over every cell in the viewport, which is three
 * or four orders of magnitude larger. Colouring bars by the cell breaks puts
 * every bar in the top class and paints the whole axis one flat red, which is
 * the failure the design warns about. The ladder is therefore fractions of the
 * largest bucket currently in view — it changes when the map moves, because
 * the data did, and holds still while the time axis is zoomed, because that
 * is the case the warning is about.
 */
const RAMP_FRACTIONS = [0, .08, .2, .35, .52, .72, .88];
function timelineRamp(max) {
  if (!(max > 0)) return COUNT_RAMP;
  const out = [];
  COUNT_RAMP.forEach(([, colour], i) => {
    const want = Math.max(1, Math.round(RAMP_FRACTIONS[i] * max));
    out.push([out.length ? Math.max(want, out[out.length - 1][0] + 1) : want, colour]);
  });
  return out;
}

/** Longitude-cyclic overlap, so world copies do not drop cells off the edge. */
function lngOverlaps(cw, ce, w, e) {
  if (e - w >= 360) return true;
  const k = Math.floor((w - cw) / 360) * 360;
  return (cw + k <= e && ce + k >= w) || (cw + k + 360 <= e && ce + k + 360 >= w);
}

/**
 * A cell reduced to what the histogram needs: a bounding box and its non-zero
 * buckets as parallel index/value arrays.
 *
 * Cached by a5 cell id, which is what keeps panning cheap. Decoding a cell
 * costs a walk over its properties; combining a cached one costs a handful of
 * adds, because a cell carries only the months in which it actually burned —
 * MVT omits the zeros, so a 311-column archive yields around fifteen entries
 * per cell, not 311.
 */
function cellRecord(f) {
  const p = f.properties, idx = [], val = [];
  for (const k in p) {
    if (!k.startsWith("count_")) continue;
    const key = k.slice(6);
    if (!BUCKET_KEY.test(key)) continue;      // count_d, count_n, count_modis
    const v = p[k];
    if (!v) continue;
    let i;
    try { i = S.axis.indexOf(key); } catch { continue; }
    if (i >= 0 && i < S.axis.count) { idx.push(i); val.push(v); }
  }
  let w = 180, e = -180, s = 90, n = -90;
  const walk = c => {
    if (typeof c[0] === "number") {
      if (c[0] < w) w = c[0]; if (c[0] > e) e = c[0];
      if (c[1] < s) s = c[1]; if (c[1] > n) n = c[1];
    } else for (const q of c) walk(q);
  };
  walk(f.geometry.coordinates);
  return {w, e, s, n, idx: Int32Array.from(idx), val: Float64Array.from(val)};
}

/**
 * Sum the bucket columns over the aggregate cells in the viewport.
 *
 * `querySourceFeatures`, not `queryRenderedFeatures`: the map's paint hides
 * cells with nothing in the selection, so a rendered query would feed the
 * timeline a histogram already filtered by the selection it is meant to drive.
 * The source query ignores paint and layout entirely.
 */
let _histoWaits = 0;
function computeHistogram() {
  if (!S.axis || !map.getSource(SRC)) return;
  // Mid-zoom, MapLibre keeps the previous level's tiles renderable while the
  // new ones arrive. Across a band edge those are two a5 resolutions covering
  // the same ground, and a dedupe on cell id cannot see that they overlap, so
  // the counts would briefly double. Wait for the tiles to settle -- but only
  // for about a second, because a source that never finishes must not strand
  // the readout at its initial value.
  if (!map.areTilesLoaded() && _histoWaits < 5) { _histoWaits++; scheduleHistogram(); return; }
  _histoWaits = 0;
  const t0 = performance.now();

  // Past the points threshold there are no aggregate cells to sum, and the
  // timeline went blank exactly when you had zoomed in to study something.
  // The points carry their own acq_date, so bucket those instead: it is the
  // same question answered from the rows rather than the rollup, and it is
  // strictly more accurate, being the detections actually in view.
  if (map.getZoom() >= S.ptsMinZoom) { histogramFromPoints(t0); return; }

  let feats;
  try {
    feats = map.querySourceFeatures(SRC, {sourceLayer: AGG_LAYER});
  } catch (e) {
    console.warn("source query failed", e);
    return;
  }
  const b = map.getBounds();
  const w = b.getWest(), e = b.getEast(), s = b.getSouth(), n = b.getNorth();
  const total = new Float64Array(S.axis.count);
  const seen = new Set();
  let inView = 0;
  for (const f of feats) {
    // Cells are clipped at tile edges, so the same cell arrives once per tile
    // it touches; without the dedupe every boundary cell is counted twice.
    const id = f.properties.a5_cell;
    if (id == null || seen.has(id)) continue;
    seen.add(id);
    let rec = S.cells.get(id);
    if (!rec) { rec = cellRecord(f); S.cells.set(id, rec); }
    if (rec.s > n || rec.n < s || !lngOverlaps(rec.w, rec.e, w, e)) continue;
    inView++;
    const {idx, val} = rec;
    for (let i = 0; i < idx.length; i++) total[idx[i]] += val[i];
  }
  const buckets = {};
  let max = 0;
  for (let i = 0; i < total.length; i++)
    if (total[i]) { buckets[S.axis.keyAt(i)] = total[i]; if (total[i] > max) max = total[i]; }
  _histoDirty = false;
  tl.ramp = timelineRamp(max);
  tl.setValues(buckets);
  const ms = performance.now() - t0;
  el("ms").textContent = `${ms.toFixed(0)} ms`;
  el("ncells").textContent = inView.toLocaleString();
  el("nlabel").textContent = "cells in view";
  window._lastHistogram = {ms, cells: inView, scanned: seen.size,
                           cached: S.cells.size,
                           total: Object.values(buckets).reduce((a, x) => a + x, 0)};
}

/**
 * The same histogram, counted from raw detections rather than cells.
 *
 * Points are already clipped to their tile and carry no cell id to dedupe on,
 * so a detection on a tile seam can be counted twice. That is a rounding error
 * against thousands of points and not worth an index to avoid.
 */
function histogramFromPoints(t0) {
  let feats;
  try {
    feats = map.querySourceFeatures(SRC, {sourceLayer: PT_LAYER});
  } catch (e) {
    console.warn("point query failed", e);
    return;
  }
  const b = map.getBounds();
  const w = b.getWest(), e = b.getEast(), s = b.getSouth(), n = b.getNorth();
  const monthly = S.axis.unit === "month";
  const buckets = {};
  let inView = 0, max = 0;
  for (const f of feats) {
    const c = f.geometry && f.geometry.coordinates;
    if (!c) continue;
    if (c[1] < s || c[1] > n || !lngOverlaps(c[0], c[0], w, e)) continue;
    const d = f.properties.acq_date;
    if (!d) continue;
    // "2020-05-06" -> "20200506", or "202005" on a monthly axis.
    const key = monthly ? d.slice(0, 7).replace("-", "")
                        : d.replace(/-/g, "");
    const v = (buckets[key] || 0) + 1;
    buckets[key] = v;
    if (v > max) max = v;
    inView++;
  }
  _histoDirty = false;
  tl.ramp = timelineRamp(max);
  tl.setValues(buckets);
  const ms = performance.now() - t0;
  el("ms").textContent = `${ms.toFixed(0)} ms`;
  el("ncells").textContent = inView.toLocaleString();
  el("nlabel").textContent = "points in view";
  window._lastHistogram = {ms, points: inView, mode: "points"};
}

// Recompute on settle, never on move. `idle` is bound because it is the
// truthful "everything has arrived" signal, but it is not relied on: a source
// that fails keeps the map from reaching `loaded` and idle then never fires,
// so moveend and sourcedata carry the readout on their own.
// The histogram counts every bucket, so it does not depend on the selection.
// But changing the selection repaints, a repaint fires idle, and idle used to
// recompute unconditionally -- so every drag of a handle paid for a rescan
// that could not change the answer. Only a new viewport or newly arrived tiles
// can, so only those mark it dirty.
let _histoPending = false;
let _histoDirty = true;
function scheduleHistogram() {
  _histoDirty = true;
  if (_histoPending) return;
  _histoPending = true;
  setTimeout(() => { _histoPending = false; computeHistogram(); }, 180);
}
function histogramIfDirty() { if (_histoDirty) scheduleHistogram(); }
// A handle for tests and the console. The app is an ES module, so nothing in
// it is reachable otherwise, and `map` in the console resolves to the DOM div
// whose id shadows it. Read-only by convention; nothing in the app uses it.
window.__explorer = {get map() { return map; }, get tl() { return tl; },
                     get state() { return S; }};

map.on("moveend", scheduleHistogram);
map.on("idle", histogramIfDirty);
map.on("sourcedata", e => { if (e.sourceId === SRC && e.isSourceLoaded) scheduleHistogram(); });

map.on("move", () => {
  el("z").textContent = map.getZoom().toFixed(1);
  // Crossing a band boundary changes both the cells and the breaks that
  // describe them, so the paint has to be rebuilt. Nothing else about a pan
  // touches the colouring.
  const band = bandAt(S.bands, map.getZoom());
  const level = band ? band.level : null;
  if (level !== S.lastLevel) applySelection();
});

// -------------------------------------------------------------- the timeline

const tl = new Timeline(el("track"), {onChange: onTimeline});
window._tl = tl;   // a handle for the console, like window._map
window._explorer = S;

function onTimeline(e) {
  S.sel = {...e.selection};
  applySelection(e.dragging);
  const a = el("selfrom"), b = el("selto");
  if (e.keys && S.axis) {
    const u = S.axis.unit;
    // Editing is suppressed while the drag that caused the change is live:
    // writing to an <input> the user is typing in fights them for the caret.
    if (editing !== a) a.value = keyToISO(e.keys.from, u);
    if (editing !== b) b.value = keyToISO(e.keys.to, u);
    a.title = formatKey(e.keys.from, u);
    b.title = formatKey(e.keys.to, u);
  }
  const d = tl.domainKeys();
  el("view").textContent = d && S.axis
    ? `${formatKey(d.from, S.axis.unit)} → ${formatKey(d.to, S.axis.unit)}` : "–";
  updateFitsHint(d);
}

/**
 * The spec's containment rule, offered rather than applied.
 *
 * The visible domain, not the selection, decides which archive can serve it.
 * Swapping the source out from under a wheel gesture would be startling, so
 * the rule is surfaced as a button and the choice stays the user's.
 */
function updateFitsHint(d) {
  const btn = el("fits");
  if (!d || !S.axis) { btn.style.display = "none"; return; }
  const latest = ARCHIVES.latest && S.available.latest !== false
    ? latestWindow() : null;
  const years = ORDER.filter(k => /^\d{4}$/.test(k));
  const want = chooseArchive(d, S.axis.unit, {latest, years});
  if (want === S.id || !ARCHIVES[want] || S.available[want] === false) {
    btn.style.display = "none";
    return;
  }
  btn.style.display = "";
  btn.textContent = `this view fits ${ARCHIVES[want].label} →`;
  btn.onclick = () => mount(want);
}

// The rolling window's own extent, once it has been read. Before that it is
// unknown and the containment test simply never picks it.
let _latestWindow = null;
function latestWindow() { return _latestWindow; }

// ------------------------------------------------------------------ controls

function renderArchiveControl() {
  const sel = el("archive");
  const sig = JSON.stringify([ORDER, S.id, ORDER.map(k => S.available[k] !== false)]);
  if (sel._sig === sig) return;    // rebuilding mid-open would shut the dropdown
  sel._sig = sig;
  sel.innerHTML = "";
  for (const k of ORDER) {
    const o = document.createElement("option");
    o.value = k;
    o.textContent = ARCHIVES[k].label +
      (S.available[k] === false ? " · unavailable" : "");
    o.disabled = S.available[k] === false;
    sel.appendChild(o);
  }
  if (S.id) sel.value = S.id;
}
el("archive").onchange = e => { if (e.target.value !== S.id) mount(e.target.value); };

// month vs date decides which native picker appears, so it follows the axis.
function syncInputs() {
  const u = S.axis.unit;
  for (const id of ["selfrom", "selto"]) {
    const i = el(id);
    i.type = u === "month" ? "month" : "date";
    i.min = keyToISO(S.axis.min, u);
    i.max = keyToISO(S.axis.max, u);
  }
}

let editing = null;
for (const id of ["selfrom", "selto"]) {
  const i = el(id);
  i.addEventListener("focus", () => { editing = i; });
  i.addEventListener("blur", () => {
    editing = null;
    if (S.axis) onTimeline({selection: S.sel, keys: tl.selectionKeys()});
  });
  i.addEventListener("change", () => {
    if (!S.axis) return;
    const u = S.axis.unit;
    const from = isoToKey(el("selfrom").value, u);
    const to = isoToKey(el("selto").value, u);
    // A half-typed date is not an error; it is a date the user has not
    // finished. Wait rather than snapping the selection somewhere arbitrary.
    if (from && to) tl.setSelectionKeys(from, to);
  });
}

el("presets").onclick = e => {
  if (!("n" in e.target.dataset)) return;
  const n = e.target.dataset.n;
  n ? tl.setSpan(+n) : tl.reset();
};
// zoomBy anchors on the selection, so these keep what is selected on screen.
el("zin").onclick = () => tl.zoomBy(1.6);
el("zout").onclick = () => tl.zoomBy(1 / 1.6);
// Reset used to live here and did exactly what the "all" preset does. Fit is
// the action the control was actually missing.
el("fit").onclick = () => tl.fitToSelection();

// A cell's own numbers, which is how you check that the map and the timeline
// are reading the same thing.
el("popx").onclick = () => { el("pop").style.display = "none"; };
map.on("click", e => {
  if (!map.getLayer(AGG)) return;
  const f = map.queryRenderedFeatures(e.point, {layers: [AGG]});
  const pop = el("pop");
  if (!f.length) { pop.style.display = "none"; return; }
  const p = f[0].properties;
  const cols = selectedColumns();
  const sum = wholeAxis() ? (p.count || 0)
    : cols.reduce((a, k) => a + (p["count_" + k] || 0), 0);
  const rows = [
    ["a5 cell", p.a5_cell],
    ["in selection", sum.toLocaleString()],
    ["all time", (p.count || 0).toLocaleString()],
    ["avg FRP", p.avg_frp == null ? "–" : (+p.avg_frp).toFixed(1) + " MW"],
    ["max FRP", p.max_frp == null ? "–" : (+p.max_frp).toFixed(0) + " MW"],
  ];
  el("pt").innerHTML = rows.map(([k, v]) =>
    `<tr><td style="color:var(--dim);padding:1.5px 0">${k}</td>` +
    `<td style="text-align:right;font-variant-numeric:tabular-nums">${v}</td></tr>`)
    .join("");
  pop.style.display = "block";
});

// ----------------------------------------------------------------- start-up

// Start discovery before the map is ready so the catalog fetch and the style
// load overlap; the first mount waits on it so the selector is complete.
const discovered = discoverYears();
renderArchiveControl();
map.on("load", async () => {
  await discovered;
  renderArchiveControl();
  // The rolling window's extent is what the containment rule tests against,
  // and it is only knowable from the archive itself.
  try {
    const r = await readArchive(ARCHIVES.latest.url);
    if (r.meta && r.meta.unit === "day")
      _latestWindow = {min: r.meta.min, max: r.meta.max};
  } catch { S.available.latest = false; renderArchiveControl(); }
  await mount(qs.get("archive") || "alltime");
});
el("track").focus();
</script></body></html>
